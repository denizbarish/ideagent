name: Bug Report
description: Report a problem in ideagent or the plugin SDK.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ideagent Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Remove tokens, email addresses and private file paths before posting.
